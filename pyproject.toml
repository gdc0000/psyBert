[project]
name = "psybert"
version = "0.1.0"
description = "BERT-based Text Analysis Application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gabriele Di Cicco" },
]
dependencies = [
    "streamlit>=1.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "sentence-transformers>=2.2",
    "torch>=2.2",
    "scipy>=1.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.11",
    "pre-commit>=3.7",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
